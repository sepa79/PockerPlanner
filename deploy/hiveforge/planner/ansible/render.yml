---
- name: Resolve explicit deployment values
  ansible.builtin.set_fact:
    planner_profile: "{{ lookup('env', 'HIVEFORGE_PROFILE') }}"
    planner_bind_root: "{{ lookup('env', 'HIVEFORGE_BIND_SOURCE_DIR') }}"
    planner_image: "{{ lookup('env', 'POCKETPLANNER_IMAGE') }}"
    planner_port: "{{ lookup('env', 'POCKETPLANNER_PORT') }}"
    planner_node: "{{ lookup('env', 'POCKETPLANNER_NODE') }}"
    planner_instance_id: "{{ lookup('env', 'POCKETPLANNER_INSTANCE_ID') }}"
    planner_ph_base: "{{ lookup('env', 'POCKETHIVE_BASE_URL') }}"
    planner_ph_public: "{{ lookup('env', 'POCKETHIVE_PUBLIC_URL') }}"
    planner_auth_base: "{{ lookup('env', 'POCKETHIVE_AUTH_BASE_URL') }}"
    planner_allow_remote_http: "{{ lookup('env', 'POCKETHIVE_ALLOW_REMOTE_HTTP') | default('false', true) }}"
    planner_mcp_hosts: "{{ lookup('env', 'POCKETPLANNER_MCP_ALLOWED_HOSTS') }}"
    planner_mcp_origins: "{{ lookup('env', 'POCKETPLANNER_MCP_ALLOWED_ORIGINS') }}"
  tags: [configuration]

- name: Require supported profile and explicit configuration
  ansible.builtin.assert:
    that:
      - planner_profile == 'swarm'
      - planner_bind_root.startswith('/')
      - planner_image | length > 0
      - planner_node | length > 0
      - planner_port is match('^[0-9]+$')
      - (planner_port | int) > 0
      - (planner_port | int) < 65536
      - planner_auth_base == '' or planner_auth_base.startswith('https://') or planner_auth_base.startswith('http://')
      - not planner_auth_base.endswith('/')
      - (planner_allow_remote_http | string | lower) in ['true', 'false']
    fail_msg: "Set the swarm profile, image, port and pinned node explicitly. PocketHive auth is optional; when configured, use its public ingress without a trailing slash."
  tags: [configuration]

- name: Create durable database directory
  ansible.builtin.file:
    path: /hf/state/pocketplanner
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0750"

- name: Create rendered stack directory
  ansible.builtin.file:
    path: /hf/stacks
    state: directory
    mode: "0755"

- name: Render Compose artifact
  ansible.builtin.template:
    src: stack.yml.j2
    dest: /hf/stacks/compose.yml
    mode: "0644"

- name: Validate the rendered Swarm configuration
  ansible.builtin.command:
    argv: [docker, stack, config, -c, /hf/stacks/compose.yml]
  changed_when: false
