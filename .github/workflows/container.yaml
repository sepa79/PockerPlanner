name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate
        run: |
          python -m unittest discover -s tests -v
          node --check web/app.js
          node --check web/auth.js
          node --check web/progress.js
          node --check web/schedule.js
          node --check tests/progress-editor.browser.js
          node --check tests/issue-editor.browser.js
          node --check tests/weekends.browser.js
          node --check tests/conflicts-import.browser.js
          node --check tests/editor-pending.browser.js
          node --test tests/*.test.cjs
      - name: Select image tags
        id: image
        env:
          IMAGE: ghcr.io/sepa79/pockerplanner
        run: |
          tags=("${IMAGE}:latest" "${IMAGE}:sha-${GITHUB_SHA}")
          version="${GITHUB_SHA}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            tags+=("${IMAGE}:${GITHUB_REF_NAME}")
            version="${GITHUB_REF_NAME}"
          fi
          printf 'tags<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${tags[@]}")" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=PocketPlanner
            org.opencontainers.image.source=https://github.com/sepa79/PockerPlanner
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
