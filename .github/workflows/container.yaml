name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install deployment configuration test tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ansible-core
      - name: Validate deployment configuration
        run: node --test tests/deployment.test.cjs
      - name: Test and build React and Java
        run: bash scripts/build-java.sh
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Select image tags
        id: image
        env:
          IMAGE: ghcr.io/sepa79/pocketplanner
        run: |
          tags=("${IMAGE}:latest" "${IMAGE}:sha-${GITHUB_SHA}")
          version="$(cat VERSION)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev)?$ ]] || exit 1
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || exit 1
            tags+=("${IMAGE}:${GITHUB_REF_NAME}")
          fi
          printf 'tags<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${tags[@]}")" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=PocketPlanner
            org.opencontainers.image.source=https://github.com/sepa79/PocketPlanner
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
