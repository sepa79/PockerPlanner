server.port=${PORT:8765}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
spring.mvc.async.request-timeout=0
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.web.resources.add-mappings=false
