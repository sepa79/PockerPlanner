services:
  pockerplanner:
    image: ghcr.io/sepa79/pockerplanner:v0.1.0
    environment:
      POCKETHIVE_AUTH_BASE_URL: "${POCKETHIVE_AUTH_BASE_URL:-}"
      POCKERPLANNER_MCP_ALLOWED_HOSTS: "${POCKERPLANNER_MCP_ALLOWED_HOSTS:-}"
      POCKERPLANNER_MCP_ALLOWED_ORIGINS: "${POCKERPLANNER_MCP_ALLOWED_ORIGINS:-}"
    ports:
      - "8765:8765"
    volumes:
      - planner_data:/data
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  planner_data:
