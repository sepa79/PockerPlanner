services:
  pocketplanner:
    image: ghcr.io/sepa79/pocketplanner:v0.2.2
    environment:
      POCKETHIVE_AUTH_BASE_URL: "${POCKETHIVE_AUTH_BASE_URL:-}"
      POCKETPLANNER_MCP_ALLOWED_HOSTS: "${POCKETPLANNER_MCP_ALLOWED_HOSTS:-}"
      POCKETPLANNER_MCP_ALLOWED_ORIGINS: "${POCKETPLANNER_MCP_ALLOWED_ORIGINS:-}"
    ports:
      - "8765:8765"
    volumes:
      - planner_data:/data
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  planner_data:
